experiment:
  name: compare_ts_vs_events_bands

repos:
  ts: C:/Users/inesv/Desktop/STRAST/mlops4rtedgeTS
  events: C:/Users/inesv/Desktop/STRAST/mlops4rtedge
  uniEvents: C:/Users/inesv/Desktop/STRAST/mlops4rtedgeUni

parents:
  ts_f01: v1_0000
  events_f01: v1_0000
  uniEvents_f01: v1_0000

base:
  event_strategy: transitions
  model_family: cnn1d
  imbalance_strategy: rare_events
  imbalance_max_maj: 20000
  seed: 42

grid:
  measures:
    - Battery_Active_Power
    - PVPCS_Active_Power

  directions:
    - high


  temporal_configs:
    - id: ow600_lt10_pw100
      OW: 600
      LT: 10
      PW: 100
      window_strategy: synchro
      nan_mode: discard

  event_band_sets:
    - id: coarse_10
      values: [10, 20, 30, 40, 50, 60, 70, 80, 90]
    - id: dense_mid
      values: [10, 25, 50, 75, 90]
    - id: fine_4
      values: [20, 40, 60, 80]

pipelines:
  - ts
  - events
  - uniEvents


outputs:
  enabled: true

  collect_after_job: true

  phases:
    f02:
      phase_name: f02_events
      variant_column: f02_variant
    f03:
      phase_name: f03_windows
      variant_column: f03_variant
    f04:
      phase_name: f04_targets
      variant_column: f04_variant
    f05:
      phase_name: f05_modeling
      variant_column: f05_variant

  destination_template: "runs/{run_id}/outputs/{pipeline}/{job_key}/{phase}"

  always_copy:
    - params.yaml
    - outputs.yaml
    - metadata.yaml
    - creation_context.yaml

  include_extensions:
    - .yaml
    - .yml
    - .json
    - .csv
    - .txt
    - .html
    - .png
    - .svg

  exclude_extensions:
    - .parquet
    - .h5
    - .tflite
    - .pkl
    - .npy
    - .npz

  max_file_mb: 10

  write_manifest_row: true
  overwrite_existing: true

