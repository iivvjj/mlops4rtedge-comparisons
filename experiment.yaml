parents:
  #ts_f01: v1_0000
  events_f01: v1_0003
  #uniEvents_f01: v1_0000

base:
  event_strategy: transitions
  model_family: cnn1d
  imbalance_strategy: rare_events
  # imbalance_strategy: auto
  imbalance_max_maj: 20000
  seed: 42
  automl:
    enabled: true
    max_trials: 3
    seed: 42
  training:
    epochs: 5
    max_samples: null
  evaluation:
    val_max_samples: 20000
    test_max_samples: 20000


grid:
  measures:
    - ac_voltage
    - ac_frequency
    - pv_input_voltage
    - pv_input_power
    - output_apparent_power
    - output_active_power
    - battery_voltage
    - battery_capacity
    - charging_current
    - battery_discharge_current
    - output_voltage
    - output_frequency
    - total_charging_current
    - total_output_apparent_power
    - total_output_active_power
    - total_output_percent
    - pv_current
    - load_current_apparent_power
    - battery_power
    - battery_power_cha
    - battery_power_plus_pv_power
    - pct_pv
    - pct_battery
    - total
    - pv_power_to_load
    - pvbatpowertoload
    - losses
    - losses_pct
    - fp


  deduplication_modes: 
    - none

  directions:
    - high
    - low

  temporal_configs:
    - id: ow50_lt10_pw10
      OW: 5
      LT: 1
      PW: 1
      window_strategy: synchro
      nan_mode: discard

    - id: ow90_lt10_pw10
      OW: 9
      LT: 1
      PW: 1
      window_strategy: synchro
      nan_mode: discard

  event_band_sets:
    - id: coarse_5_rare
      values: [10, 25, 50, 75, 90]


pipelines:
  #- ts
  - events
  #- uniEvents


outputs:
  enabled: true

  collect_after_job: true

  phases:
    f02:
      phase_name: f02_events
      variant_column: f02_variant
    f03:
      phase_name: f03_windows
      variant_column: f03_variant
    f04:
      phase_name: f04_targets
      variant_column: f04_variant
    f05:
      phase_name: f05_modeling
      variant_column: f05_variant
    f06:
      phase_name: f06_quantization
      variant_column: f06_variant

  destination_template: "runs/{run_id}/outputs/{pipeline}/{job_key}/{phase}"

  always_copy:
    - params.yaml
    - outputs.yaml
    - metadata.yaml
    - creation_context.yaml

  include_extensions:
    - .yaml
    - .yml
    - .json
    - .csv
    - .txt
    - .html
    - .png
    - .svg

  exclude_extensions:
    - .parquet
    - .h5
    - .tflite
    - .pkl
    - .npy
    - .npz

  max_file_mb: 10

  write_manifest_row: true
  overwrite_existing: true

